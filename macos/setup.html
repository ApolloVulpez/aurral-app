<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect to Aurral</title>
  <link rel="stylesheet" href="setup.css">
  <script src="setup.js" defer></script>
</head>
<body>
  <main>
    <h1>Connect to Aurral</h1>
    <form>
      <label for="server">Server URL</label>
      <input id="server" type="url" placeholder="https://music.example.com" required autofocus>
      <p>Use the address you open in your browser.</p>
      <div class="actions">
        <span id="error" role="alert"></span>
        <button type="submit">Connect</button>
      </div>
    </form>
  </main>
</body>
</html>
